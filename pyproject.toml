# Gerber2MSLA — expose photoresist on an MSLA printer (Anycubic Photon Mono X 6Ks).
# A mask (PNG in exact screen pixels) becomes a one-layer printer file (.px6s); there is
# no laser, no machine link and no G-code here. Canon: the design note
# techdocs/handoff/claude/design/design_2026_10_23_gerber2msla.md.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gerber2msla"
description = "Expose photoresist on an MSLA printer: pixel-exact masks and one-layer .px6s files"
readme = "README.md"
# 3.11+: the tool is small, but the sibling project (Gerber2LDI) keeps the same floor and
# the test suite uses the same plugins.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Denis" }]
version = "0.1.0.dev0"
dependencies = [
    # A mask is an array of screen pixels; one library for the pixel arithmetic.
    "numpy==2.5.4",
    # PNG: mode L, exactly the LCD resolution, the report in a text chunk.
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    # `-n auto` on the command line, NOT in addopts (rules: deepseek.md п.15).
    "pytest-xdist==3.8.0",
    # Second acceptance leg: `--reverse`. Without this line the leg silently does not
    # exist on a machine that never installed it.
    "pytest-reverse==1.9.0",
    "pyflakes==4.0.3",
]

[project.scripts]
gerber2msla = "gerber2msla.cli:main"

[tool.setuptools.packages.find]
include = ["gerber2msla*"]
